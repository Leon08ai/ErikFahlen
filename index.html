
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gubben som hoppar!</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(#87ceeb, #e0f7ff);
      color: #183044;
    }

    h1 {
      margin-top: 25px;
    }

    canvas {
      display: block;
      margin: 20px auto;
      max-width: 95%;
      border: 4px solid white;
      border-radius: 15px;
      background: linear-gradient(
        skyblue 0%,
        #e0f7ff 78%,
        #59b34f 78%
      );
    }

    button {
      padding: 12px 22px;
      font-size: 17px;
      border: none;
      border-radius: 20px;
      background: #1769aa;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #104c7b;
    }
  </style>
</head>

<body>

  <h1>🤸 Gubben som hoppar!</h1>
  <p>Rör dig med piltangenterna och hoppa med mellanslag.</p>

  <canvas id="game" width="800" height="400"></canvas>

  <button onclick="resetGame()">Börja om</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const ground = 310;

    let player;
    let keys = {};
    let stars;
    let score;
    let frame = 0;

    function resetGame() {
      player = {
        x: 100,
        y: ground - 60,
        width: 35,
        height: 60,
        vx: 0,
        vy: 0,
        onGround: true
      };

      stars = [
        { x: 250, y: 220, collected: false },
        { x: 420, y: 170, collected: false },
        { x: 600, y: 220, collected: false }
      ];

      score = 0;
    }

    document.addEventListener("keydown", function(e) {
      keys[e.key.toLowerCase()] = true;

      if (
        [" ", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.key)
      ) {
        e.preventDefault();
      }

      if (
        (e.key === " " || e.key === "ArrowUp") &&
        player.onGround
      ) {
        player.vy = -12;
        player.onGround = false;
      }
    });

    document.addEventListener("keyup", function(e) {
      keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener("click", function() {
      if (player.onGround) {
        player.vy = -12;
        player.onGround = false;
      }
    });

    function drawPlayer() {
      const x = player.x;
      const y = player.y;

      // Huvud
      ctx.fillStyle = "#ffbf86";
      ctx.beginPath();
      ctx.arc(x + 17, y + 12, 13, 0, Math.PI * 2);
      ctx.fill();

      // Hår
      ctx.fillStyle = "#593b2b";
      ctx.beginPath();
      ctx.arc(x + 17, y + 8, 13, Math.PI, Math.PI * 2);
      ctx.fill();

      // Öga
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.arc(x + 22, y + 12, 2, 0, Math.PI * 2);
      ctx.fill();

      // Kropp
      ctx.strokeStyle = "#ff8833";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x + 17, y + 25);
      ctx.lineTo(x + 17, y + 43);
      ctx.stroke();

      // Armar
      ctx.strokeStyle = "#ffbf86";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x + 17, y + 29);
      ctx.lineTo(x + 3, y + 39);
      ctx.moveTo(x + 17, y + 29);
      ctx.lineTo(x + 31, y + 39);
      ctx.stroke();

      // Ben
      ctx.strokeStyle = "#2454a4";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(x + 17, y + 43);
      ctx.lineTo(x + 7, y + 58);
      ctx.moveTo(x + 17, y + 43);
      ctx.lineTo(x + 27, y + 58);
      ctx.stroke();
    }

    function update() {
      frame++;

      if (keys["arrowleft"] || keys["a"]) {
        player.x -= 4;
      }

      if (keys["arrowright"] || keys["d"]) {
        player.x += 4;
      }

      player.x = Math.max(
        0,
        Math.min(canvas.width - player.width, player.x)
      );

      // Tyngdkraft
      player.vy += 0.55;
      player.y += player.vy;

      // Marken
      if (player.y + player.height >= ground) {
        player.y = ground - player.height;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      // Samla stjärnor
      stars.forEach(star => {
        if (star.collected) return;

        const dx = player.x + 17 - star.x;
        const dy = player.y + 25 - star.y;

        if (Math.sqrt(dx * dx + dy * dy) < 28) {
          star.collected = true;
          score++;
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Moln
      ctx.fillStyle = "white";

      for (let i = 0; i < 4; i++) {
        const x = (i * 220 - frame * 0.3) % 900;

        ctx.beginPath();
        ctx.arc(x, 70, 20, 0, Math.PI * 2);
        ctx.arc(x + 25, 65, 25, 0, Math.PI * 2);
        ctx.arc(x + 50, 70, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      // Gräs
      ctx.fillStyle = "#59b34f";
      ctx.fillRect(0, ground, canvas.width, 90);

      // Stjärnor
      stars.forEach(star => {
        if (star.collected) return;

        ctx.font = "28px Arial";
        ctx.fillStyle = "gold";
        ctx.fillText("⭐", star.x - 14, star.y + 10);
      });

      // Poäng
      ctx.fillStyle = "#183044";
      ctx.font = "bold 22px Arial";
      ctx.fillText("Poäng: " + score, 20, 30);

      drawPlayer();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetGame();
    gameLoop();
  </script>

</body>
</html>
